<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background-color: #121212;
        color: #ffffff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
    }
    .card {
        background: #1e1e1e;
        padding: 30px;
        border-radius: 12px;
        text-align: center;
        max-width: 480px;
        width: 90%;
        border: 1px solid #333;
        box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    h2 { margin-bottom: 10px; font-size: 22px; }
    p { color: #aaa; font-size: 14px; margin-bottom: 20px; }
    input[type="file"] { display: none; }
    
    .btn-upload {
        display: inline-block;
        padding: 12px 24px;
        background: #4f46e5;
        color: #fff;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        transition: background 0.2s;
        width: 100%;
        margin-bottom: 15px;
    }
    .btn-upload:hover { background: #4338ca; }

    .divider {
        margin: 15px 0;
        color: #666;
        font-size: 13px;
        display: flex;
        align-items: center;
    }
    .divider::before, .divider::after {
        content: "";
        flex: 1;
        border-bottom: 1px solid #333;
    }
    .divider span { padding: 0 10px; }

    .url-box {
        display: flex;
        gap: 8px;
        margin-top: 10px;
    }
    .url-input {
        flex: 1;
        padding: 10px;
        background: #2a2a2a;
        border: 1px solid #444;
        border-radius: 6px;
        color: #fff;
        outline: none;
    }
    .url-input:focus { border-color: #4f46e5; }
    .btn-play {
        padding: 10px 16px;
        background: #10b981;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
    }
    .btn-play:hover { background: #059669; }

    iframe {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        border: none;
        display: none;
        background: #000;
    }
</style>
<div id="main-card" class="card">
    <h2>Запустити Scratch / HTML гру</h2>
    <p>Завантажте файл зі свого пристрою або вставте посилання</p>
    
    <!-- Спосіб 1: Файл з пристрою -->
    <label for="fileInput" class="btn-upload">Обрати .html файл</label>
    <input type="file" id="fileInput" accept=".html">
    
    <div class="divider"><span>АБО</span></div>

    <!-- Спосіб 2: Вставка посилання -->
    <div class="url-box">
        <input type="url" id="urlInput" class="url-input" placeholder="Вставте URL посилання на .html файл">
        <button id="playBtn" class="btn-play">Грати</button>
    </div>
</div>

<!-- Вікно з грою -->
<iframe id="player" allowfullscreen allow="autoplay; gamepad; microphone"></iframe>

<script>
    const fileInput = document.getElementById('fileInput');
    const urlInput = document.getElementById('urlInput');
    const playBtn = document.getElementById('playBtn');
    const mainCard = document.getElementById('main-card');
    const player = document.getElementById('player');

    // Функція запуску гри у повноекранному вікні
    function launchGame(src, isDirectCode = false) {
        mainCard.style.display = 'none';
        player.style.display = 'block';

        if (isDirectCode) {
            player.srcdoc = src;
        } else {
            player.src = src;
        }
    }

    // 1. Обробка локального .html файлу
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            launchGame(event.target.result, true);
        };
        reader.readAsText(file);
    });

    // 2. Обробка посилання
    playBtn.addEventListener('click', function() {
const url = urlInput.value.trim();
        if (url) {
            launchGame(url, false);
        } else {
            alert('Будь ласка, введіть посилання на файл!');
        }
    });
</script>
