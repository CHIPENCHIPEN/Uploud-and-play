<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запустити Scratch / HTML гру</title>
    <style>
        :root {
            --bg-color: #020617;       /* Майже чорний геймерський фон */
            --card-bg: #0f172a;        /* Темно-сіра картка форми */
            --accent-color: #06b6d4;   /* Яскравий неоново-блакитний (ціан) */
            --accent-hover: #0891b2;   /* Колір кнопок при наведенні */
            --text-color: #f8fafc;     /* Головний білий текст */
            --text-muted: #64748b;     /* Другорядний сірий текст */
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: var(--text-color);
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1rem;
        }

        /* Оновлена зона завантаження */
        .drop-zone {
            border: 2px dashed var(--accent-color);
            border-radius: 12px;
            padding: 40px 20px;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .drop-zone:hover, .drop-zone.dragover {
            background: rgba(6, 182, 212, 0.1);
            border-color: #22d3ee;
        }

        /* Невидимий інпут, розтягнутий на всю зону для кліків на iOS */
        .file-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 10;
        }

        #file-label {
            font-size: 1.1rem;
            color: var(--text-color);
            pointer-events: none; /* Щоб текст не заважав клікати по інпуту */
            z-index: 5;
        }

        .or-divider {
            margin: 20px 0;
            color: var(--text-muted);
            font-weight: bold;
            font-size: 0.9rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
            margin-bottom: 25px;
        }

        label {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #020617; /* Темний текст на світлій кнопці для контрасту */
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: var(--accent-hover);
            color: white;
        }

        button:active {
            transform: scale(0.98);
        }

        /* Вікно гри на весь екран */
        #game-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 9999;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(239, 68, 68, 0.9);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            z-index: 10000;
            width: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .close-btn:hover { 
            background: rgb(220, 38, 38); 
        }
    </style>
</head>

        <div class="drop-zone" id="drop-zone">

        <div class="or-divider">АБО</div>

        <div class="input-group">

            <input type="text" id="url-input" placeholder="https://example.com">
        </div>

        <button id="play-btn">Грати 🚀</button>
    </div>

    <div id="game-container">

    </div>
