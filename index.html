<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background-color: #121212;
        color: #ffffff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        padding: 30px 15px;
    }
    .card {
        background: #1e1e1e;
        padding: 30px;
        border-radius: 12px;
        text-align: center;
        max-width: 500px;
        width: 100%;
        border: 1px solid #333;
        box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        margin-bottom: 25px;
    }
    h2 { margin-bottom: 10px; font-size: 22px; }
    p { color: #aaa; font-size: 14px; margin-bottom: 20px; }
    input[type="file"] { display: none; }
    
    .btn-upload {
        display: inline-block;
        padding: 12px 24px;
        background: #4f46e5;
        color: #fff;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        transition: background 0.2s;
        width: 100%;
        margin-bottom: 15px;
    }
    .btn-upload:hover { background: #4338ca; }

    .divider {
        margin: 15px 0;
        color: #666;
        font-size: 13px;
        display: flex;
        align-items: center;
    }
    .divider::before, .divider::after {
        content: "";
        flex: 1;
        border-bottom: 1px solid #333;
    }
    .divider span { padding: 0 10px; }

    .url-box {
        display: flex;
        gap: 8px;
        margin-top: 10px;
    }
    .url-input {
        flex: 1;
        padding: 10px;
        background: #2a2a2a;
        border: 1px solid #444;
        border-radius: 6px;
        color: #fff;
        outline: none;
    }
    .url-input:focus { border-color: #4f46e5; }
    .btn-play {
        padding: 10px 16px;
        background: #10b981;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
    }
    .btn-play:hover { background: #059669; }

    .game-wrapper {
        display: none;
        width: 100%;
        max-width: 960px;
        flex-direction: column;
        align-items: center;
        gap: 15px;
    }
    iframe {
        width: 100%;
        height: 600px;
        border: 2px solid #333;
        border-radius: 12px;
        background-color: #000;
    }
    .link-container {
        background: #1e1e1e;
        padding: 12px 20px;
        border-radius: 8px;
        border: 1px solid #333;
        width: 100%;
        word-break: break-all;
        text-align: center;
        font-size: 14px;
        color: #aaa;
    }
    .link-container a {
        color: #60a5fa;
        text-decoration: none;
        font-weight: bold;
    }
    .link-container a:hover {
        text-decoration: underline;
    }
</style>
<div class="card">
    <h2>Запустити Scratch / HTML гру</h2>
    <p>Оберіть файл або вставте посилання,<br>і гра з'явиться нижче на сторінці</p>
    
    <!-- 1: Вибір файлу -->
    <label for="fileInput" class="btn-upload">Обрати .html файл</label>
    <input type="file" id="fileInput" accept=".html">
    
    <div class="divider"><span>АБО</span></div>

    <!-- 2: Вставка посилання -->
    <div class="url-box">
        <input type="url" id="urlInput" class="url-input" placeholder="Вставте URL посилання (https://...)">
        <button id="playBtn" class="btn-play">Грати</button>
    </div>
</div>

<!-- Блок гри -->
<div class="game-wrapper" id="gameWrapper">
    <iframe id="gameFrame" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms allow-modals"></iframe>
    <div class="link-container">
        Посилання на гру: <a id="gameLink" href="#" target="_blank"></a>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const urlInput = document.getElementById('urlInput');
    const playBtn = document.getElementById('playBtn');
const gameWrapper = document.getElementById('gameWrapper');
    const gameFrame = document.getElementById('gameFrame');
    const gameLink = document.getElementById('gameLink');

    let currentBlobUrl = null;

    // Зчитування .html файлу через FileReader для надійного відображення в iframe
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            const htmlContent = evt.target.result;

            // Записуємо код гри прямо в iframe через srcdoc
            gameFrame.removeAttribute('src');
            gameFrame.srcdoc = htmlContent;

            // Створюємо унікальне Blob-посилання для кнопки відкриття в новій вкладці
            if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
            const blob = new Blob([htmlContent], { type: 'text/html' });
            currentBlobUrl = URL.createObjectURL(blob);

            gameLink.href = currentBlobUrl;
            gameLink.textContent = currentBlobUrl;

            gameWrapper.style.display = 'flex';
        };
        reader.readAsText(file);
    });

    // Запуск за прямим веб-посиланням (https://...)
    playBtn.addEventListener('click', function() {
        const url = urlInput.value.trim();
        if (!url) {
            alert('Будь ласка, введіть посилання!');
            return;
        }

        if (url.startsWith('blob:')) {
            alert('Blob-посилання створюються тимчасово для файлу з вашого ПК. Щоб відкрити її заново — оберіть .html файл кнопкою вище!');
            return;
        }

        gameFrame.removeAttribute('srcdoc');
        gameFrame.src = url;
        gameLink.href = url;
        gameLink.textContent = url;

        gameWrapper.style.display = 'flex';
    });
</script>
