<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запустити Scratch / HTML гру</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .drop-zone {
            border: 2px dashed var(--accent-color);
            border-radius: 12px;
            padding: 30px 20px;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-bottom: 20px;
        }

        .drop-zone:hover, .drop-zone.dragover {
            background: rgba(99, 102, 241, 0.1);
        }

        .file-input {
            display: none;
        }

        .or-divider {
            margin: 20px 0;
            color: var(--text-muted);
            position: relative;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
            margin-bottom: 25px;
        }

        label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        /* Контейнер гри */
        #game-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 9999;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(239, 68, 68, 0.85);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            z-index: 10000;
        }
        .close-btn:hover { background: rgb(220, 38, 38); }
    </style>
</head>
<body>

    <div class="container" id="main-ui">
        <h1>Запустити Scratch / HTML гру</h1>
        <p class="subtitle">Оберіть файл зі свого ПК або вставте посилання, щоб зіграти прямо на сайті</p>

        <!-- Завантаження файлу -->
        <div class="drop-zone" id="drop-zone">
            <span id="file-label">📁 Обрати або перетягнути .html файл</span>
            <input type="file" id="file-input" class="file-input" accept=".html">
        </div>

        <div class="or-divider">АБО</div>

        <!-- Посилання -->
        <div class="input-group">
            <label for="url-input">Пряме посилання на гру:</label>
            <input type="text" id="url-input" placeholder="https://example.com">
        </div>

        <button id="play-btn">Грати 🚀</button>
    </div>

    <!-- Вікно для iframe гри -->
    <div id="game-container">
        <button class="close-btn" id="close-btn">❌ Закрити гру</button>
        <iframe id="game-frame" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        const fileLabel = document.getElementById('file-label');
        const urlInput = document.getElementById('url-input');
        const playBtn = document.getElementById('play-btn');
        const gameContainer = document.getElementById('game-container');
        const gameFrame = document.getElementById('game-frame');
        const closeBtn = document.getElementById('close-btn');

        let selectedFileBlob = null;

        // --- РОБОТА З INDEXEDDB (Для захисту від збоїв на iOS) ---
        function openDB() {
            return new Promise((resolve) => {
                let request = indexedDB.open("GameStorage", 1);
                request.onupgradeneeded = (e) => {
                    e.target.result.createObjectStore("games");
                };
                request.onsuccess = (e) => resolve(e.target.result);
            });
        }

        async function saveToDB(blob) {
            let db = await openDB();
            let tx = db.transaction("games", "readwrite");
            tx.objectStore("games").put(blob, "last_game");
        }

        async function getFromDB() {
            let db = await openDB();
            return new Promise((resolve) => {
                let tx = db.transaction("games", "readonly");
                let req = tx.objectStore("games").get("last_game");
                req.onsuccess = () => resolve(req.result);
            });
        }

        async function clearDB() {
            let db = await openDB();
            let tx = db.transaction("games", "readwrite");
            tx.objectStore("games").delete("last_game");
        }
