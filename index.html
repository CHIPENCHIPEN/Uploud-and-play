<style>
  :root{
    --bg:#0b0b14; --surface:#14141f; --surface2:#1b1b2a; --line:#262638;
    --text:#f2f2f8; --muted:#9a9ab3;
    --a:#6c5ce7; --b:#ff6b9d; --ok:#2ee6a6; --danger:#ff5c7a;
    --grad:linear-gradient(135deg,var(--a),var(--b));
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;
    background-image:
      radial-gradient(700px 400px at 15% -5%,rgba(108,92,231,.28),transparent 60%),
      radial-gradient(600px 380px at 90% 0%,rgba(255,107,157,.18),transparent 60%);
    background-repeat:no-repeat;
  }
  button{font:inherit;cursor:pointer;border:0;color:inherit}

  /* top bar */
  .nav{display:flex;align-items:center;justify-content:space-between;max-width:1080px;margin:0 auto;padding:18px 20px}
  .logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px;letter-spacing:-.2px}
  .logo i{width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 20px rgba(108,92,231,.45)}
  .logo i svg{width:18px;height:18px;fill:#fff;margin-left:2px}
  .btn{background:var(--grad);color:#fff;font-weight:700;padding:11px 20px;border-radius:12px;box-shadow:0 8px 24px rgba(108,92,231,.35);transition:transform .12s,box-shadow .12s}
  .btn:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(108,92,231,.5)}
  .btn:active{transform:translateY(0)}
  .btn.sm{padding:8px 14px;font-size:14px;border-radius:10px;box-shadow:none}
  .btn.ghost{background:var(--surface2);box-shadow:none;border:1px solid var(--line);color:var(--text)}
  .btn.ghost:hover{background:#232336}

  main{max-width:1080px;margin:0 auto;padding:0 20px 80px}

  /* hero */
  .hero{text-align:center;padding:44px 0 28px}
  .hero h1{margin:0;font-size:clamp(34px,6vw,56px);line-height:1.05;font-weight:800;letter-spacing:-1.5px}
  .hero h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{margin:16px auto 0;max-width:520px;color:var(--muted);font-size:17px;line-height:1.5}

  .drop{
    margin:32px auto 0;max-width:680px;padding:38px 24px;border-radius:22px;text-align:center;cursor:pointer;
    background:linear-gradient(var(--surface),var(--surface)) padding-box,
               linear-gradient(135deg,rgba(108,92,231,.7),rgba(255,107,157,.7)) border-box;
    border:2px dashed transparent;transition:transform .15s,box-shadow .15s;
  }
  .drop:hover,.drop.over{transform:translateY(-2px);box-shadow:0 18px 50px rgba(108,92,231,.25)}
  .drop.over{background:linear-gradient(#1a1a2c,#1a1a2c) padding-box,linear-gradient(135deg,#6c5ce7,#ff6b9d) border-box}
  .drop .ic{width:64px;height:64px;margin:0 auto 14px;border-radius:18px;background:var(--grad);display:grid;place-items:center}
  .drop .ic svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .drop h2{margin:0 0 6px;font-size:20px}
  .drop p{margin:0;color:var(--muted);font-size:14px}

  /* library */
  .lib-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:48px 0 18px;flex-wrap:wrap}
  .lib-head h3{margin:0;font-size:22px;letter-spacing:-.3px}
  .lib-head h3 small{color:var(--muted);font-weight:500;font-size:14px;margin-left:8px}
  .search{background:var(--surface);border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:12px;font:inherit;width:240px;max-width:100%;outline:none}
  .search:focus{border-color:var(--a)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
  .card:hover{transform:translateY(-3px);border-color:#3a3a56}
  .thumb{height:130px;position:relative;display:grid;place-items:center;font-size:52px;font-weight:800;color:rgba(255,255,255,.92);cursor:pointer}
  .thumb::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,0);transition:.15s}
  .thumb:hover::after{background:rgba(0,0,0,.25)}
  .thumb .pl{position:absolute;z-index:1;width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;opacity:0;transform:scale(.8);transition:.15s}
  .thumb:hover .pl{opacity:1;transform:scale(1)}
  .thumb .pl svg{width:20px;height:20px;fill:#111;margin-left:3px}
  .card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
  .name{font-weight:700;font-size:16px;word-break:break-word;line-height:1.25}
  .meta{color:var(--muted);font-size:12.5px;margin-top:3px}
  .acts{display:flex;gap:8px}
  .acts .btn{flex:1}
  .ib{width:36px;height:36px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;flex:none}
  .ib:hover{background:#232336}
  .ib svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ib.del:hover svg{stroke:var(--danger)}

  .empty{text-align:center;color:var(--muted);padding:50px 20px;border:1px dashed var(--line);border-radius:18px}
  .foot{margin-top:50px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}

  /* player */
  #player{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:50}
  #player.show{display:flex}
  .pbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
  .pbar .t{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #frame{flex:1 1 0;min-height:0;width:100%;height:100%;border:0;background:#000;display:block}

  .dlg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:90;padding:20px}
  .dlg.show{display:grid}
  .dlg .box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;width:100%;max-width:380px}
  .dlg h4{margin:0 0 8px;font-size:18px}
  .dlg p{margin:0 0 14px;color:var(--muted);font-size:14px;word-break:break-word}
  .dlg input{width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--text);padding:11px 13px;border-radius:10px;font:inherit;margin-bottom:14px;outline:none}
  .dlg input:focus{border-color:var(--a)}
