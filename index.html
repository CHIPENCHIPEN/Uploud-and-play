<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background-color: #121212;
        color: #ffffff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
    }
    .card {
        background: #1e1e1e;
        padding: 30px;
        border-radius: 12px;
        text-align: center;
        max-width: 480px;
        width: 90%;
        border: 1px solid #333;
        box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    h2 { margin-bottom: 10px; font-size: 22px; }
    p { color: #aaa; font-size: 14px; margin-bottom: 20px; }
    input[type="file"] { display: none; }
    
    .btn-upload {
        display: inline-block;
        padding: 12px 24px;
        background: #4f46e5;
        color: #fff;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        transition: background 0.2s;
        width: 100%;
        margin-bottom: 15px;
    }
    .btn-upload:hover { background: #4338ca; }

    .divider {
        margin: 15px 0;
        color: #666;
        font-size: 13px;
        display: flex;
        align-items: center;
    }
    .divider::before, .divider::after {
        content: "";
        flex: 1;
        border-bottom: 1px solid #333;
    }
    .divider span { padding: 0 10px; }

    .url-box {
        display: flex;
        gap: 8px;
        margin-top: 10px;
    }
    .url-input {
        flex: 1;
        padding: 10px;
        background: #2a2a2a;
        border: 1px solid #444;
        border-radius: 6px;
        color: #fff;
        outline: none;
    }
    .url-input:focus { border-color: #4f46e5; }
    .btn-play {
        padding: 10px 16px;
        background: #10b981;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
    }
    .btn-play:hover { background: #059669; }
</style>
<div class="card">
    <h2>Запустити Scratch / HTML гру</h2>
    <p>Завантажте файл або вставте посилання,<br>і гра відкриється в окремому вікні</p>
    
    <label for="fileInput" class="btn-upload">Обрати .html файл</label>
    <input type="file" id="fileInput" accept=".html">
    
    <div class="divider"><span>АБО</span></div>

    <div class="url-box">
        <input type="url" id="urlInput" class="url-input" placeholder="Вставте URL посилання на .html файл">
        <button id="playBtn" class="btn-play">Грати</button>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const urlInput = document.getElementById('urlInput');
    const playBtn = document.getElementById('playBtn');

    // 1. Відкриваємо нову вкладку НЕГАЙНО при виборі файлу (щоб браузер не вважав це спамом)
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        // Відкриваємо вікно одразу в момент дії користувача
        const newTab = window.open('about:blank', '_blank');

        if (newTab) {
            const blobUrl = URL.createObjectURL(file);
            // Перенаправляємо створену вкладку на Blob-посилання вашої гри
            newTab.location.href = blobUrl;
        } else {
            alert('Будь ласка, дозвольте спливаючі вікна в адресному рядку браузера!');
        }
    });

    // 2. Відкриття гри за URL-посиланням у новій вкладці
    playBtn.addEventListener('click', function() {
        const url = urlInput.value.trim();
        if (url) {
            window.open(url, '_blank');
        } else {
            alert('Будь ласка, введіть посилання на файл!');
        }
    });
</script>
