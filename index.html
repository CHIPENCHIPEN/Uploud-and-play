<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">

<!-- Завантажуємо офіційний плеєр Scaffolder (TurboWarp Engine) -->
<script src="https://packager.turbowarp.org/scaffolder-html-standalone.js"></script>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background-color: #121212;
        color: #ffffff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
    }
    .card {
        background: #1e1e1e;
        padding: 30px;
        border-radius: 12px;
        text-align: center;
        max-width: 480px;
        width: 90%;
        border: 1px solid #333;
        box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    h2 { margin-bottom: 10px; font-size: 22px; }
    p { color: #aaa; font-size: 14px; margin-bottom: 20px; }
    input[type="file"] { display: none; }
    .btn-upload {
        display: inline-block;
        padding: 12px 24px;
        background: #4f46e5;
        color: #fff;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
    }
    .btn-upload:hover { background: #4338ca; }
    .link-box {
        margin-top: 20px;
        padding: 12px;
        background: #2a2a2a;
        border-radius: 8px;
        border: 1px solid #444;
        word-break: break-all;
    }
    a { color: #38bdf8; text-decoration: none; font-weight: bold; }
    #wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: none;
        background: #000;
    }
    canvas {
        width: 100%;
        height: 100%;
        display: block;
    }
</style>
<div id="upload-screen" class="card">
    <h2>Завантажити Scratch проєкт</h2>
    <p>Оберіть .sb3 файл з комп'ютера</p>
    
    <label for="fileInput" class="btn-upload">Обрати .sb3 файл</label>
    <input type="file" id="fileInput" accept=".sb3">
    
    <div id="result" style="display: none;">
        <div class="link-box">
            <p style="margin-bottom: 5px; color: #fff;">Посилання на вашу гру:</p>
            <a id="gameLink" href="#"></a>
        </div>
    </div>
</div>

<!-- Контейнер для прямого запуску гри без iframe -->
<div id="wrapper">
    <canvas id="stage"></canvas>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const uploadScreen = document.getElementById('upload-screen');
    const resultDiv = document.getElementById('result');
    const gameLink = document.getElementById('gameLink');
    const wrapper = document.getElementById('wrapper');

    function openDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open('ScratchGameDB', 1);
            request.onupgradeneeded = () => request.result.createObjectStore('projects');
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }

    async function saveProject(id, fileData) {
        const db = await openDB();
        const tx = db.transaction('projects', 'readwrite');
        tx.objectStore('projects').put(fileData, id);
        return tx.complete;
    }

    async function getProject(id) {
        const db = await openDB();
        return new Promise((resolve) => {
            const tx = db.transaction('projects', 'readonly');
            const req = tx.objectStore('projects').get(id);
            req.onsuccess = () => resolve(req.result);
        });
    }

    async function loadGameIfHashExists() {
        const hash = window.location.hash;
        if (hash.startsWith('#project=')) {
            const projectId = hash.replace('#project=', '');
            const fileData = await getProject(projectId);
            
            if (fileData) {
                uploadScreen.style.display = 'none';
                wrapper.style.display = 'block';
// Запуск проекту прямо в браузері через бібліотеку Scaffolder
                const sc = new Scaffolder();
                sc.setCanvas(document.getElementById('stage'));
                
                const arrayBuffer = await fileData.arrayBuffer();
                await sc.loadProject(arrayBuffer);
                sc.start();
            } else {
                alert('Проєкт не знайдено на цьому пристрої.');
            }
        }
    }

    fileInput.addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const projectId = Math.random().toString(36).substring(2, 9);
        await saveProject(projectId, file);

        const fullUrl = window.location.origin + window.location.pathname + '#project=' + projectId;
        
        gameLink.href = fullUrl;
        gameLink.innerText = fullUrl;
        resultDiv.style.display = 'block';
    });

    loadGameIfHashExists();
</script>
