<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Game Hub</title>
    <style>
        :root {
            --bg-color: #0f111a;       /* Темний глибокий фон */
            --card-bg: #1a1c28;        /* Контрастна фіолетово-темна картка */
            --accent-color: #8b5cf6;   /* Яскравий фіолетовий колір */
            --accent-hover: #7c3aed;   /* Фіолетовий при наведенні */
            --text-color: #ffffff;     /* Білий текст */
            --text-muted: #94a3b8;     /* Чіткий сірий текст */
            --input-bg: #0f111a;       /* Фон для поля вводу */
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: var(--card-bg);
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 30px rgba(139, 92, 246, 0.1);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2rem;
            margin: 0 0 10px 0;
            font-weight: 800;
            color: var(--text-color);
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .drop-zone {
            border: 2px dashed var(--accent-color);
            border-radius: 14px;
            padding: 35px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(139, 92, 246, 0.03);
        }

        .drop-zone:hover, .drop-zone.dragover {
            background: rgba(139, 92, 246, 0.1);
            border-color: #a78bfa;
        }

        .file-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 10;
        }

        #file-label {
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-color);
            pointer-events: none;
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .or-divider {
            margin: 20px 0;
            color: var(--text-muted);
            font-weight: bold;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }

        label {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .url-container {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 16px;
            background: var(--input-bg);
            border: 1px solid #334155;
            border-radius: 10px;
            color: white;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .url-btn {
            padding: 14px 24px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .url-btn:hover {
            background-color: var(--accent-hover);
        }

        /* --- ІГРОВА ЗОНА ТУРБОВАРП 480x360 --- */
        #game-wrapper {
            display: none; /* З'являється тільки під час гри */
            width: 480px;
            height: 360px;
            background: #000000;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 40px rgba(139, 92, 246, 0.2);
            border: 3px solid var(--accent-color);
            margin-bottom: 30px;
        }

        iframe {
            width: 480px;
            height: 360px;
            border: none;
            display: block;
        }

        .close-game-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(239, 68, 68, 0.85);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            z-index: 100;
            transition: background 0.2s;
        }

        .close-game-btn:hover {
            background: rgb(220, 38, 38);
        }
    </style>
</head>
<body>

    <div class="container" id="main-ui">
        <h1>Запустити Scratch / HTML гру</h1>
        <p class="subtitle">Оберіть файл зі свого ПК або вставте посилання, щоб зіграти прямо на сайті</p>

        <!-- Зона завантаження файлу (Гра запускається ТУТ) -->
        <div class="drop-zone" id="drop-zone">
            <input type="file" id="file-input" class="file-input" accept=".html">
            <span id="file-label">
                <span style="font-size: 2rem;">📁</span>
                <span>Обрати або перетягнути .html файл з ПК</span>
            </span>
        </div>

        <div class="or-divider">АБО</div>

        <!-- Запуск по посиланню -->
        <div class="input-group">
            <label for="url-input">Пряме посилання на гру:</label>
            <div class="url-container">
                <input type="text" id="url-input" placeholder="https://example.com">
                <button class="url-btn" id="play-url-btn">Грати 🚀</button>
            </div>
        </div>
    </div>

    <!-- Вбудоване ігрове вікно точно 480х360 прямо на сторінці -->
    <div id="game-wrapper">
        <button class="close-game-btn" id="close-game-btn">❌ Вийти</button>
        <iframe id="game-frame" allow="fullscreen; autoplay" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>
