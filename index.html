<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background-color: #121212;
        color: #fff;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
    }
    .card {
        background: #1e1e1e;
        padding: 30px;
        border-radius: 12px;
        text-align: center;
        max-width: 480px;
        width: 90%;
        border: 1px solid #333;
    }
    input[type="file"] { display: none; }
    .btn-upload {
        display: inline-block;
        padding: 12px 24px;
        background: #4f46e5;
        color: #fff;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        margin-top: 15px;
    }
    .link-box {
        margin-top: 20px;
        padding: 12px;
        background: #2a2a2a;
        border-radius: 8px;
        word-break: break-all;
    }
    a { color: #38bdf8; text-decoration: none; font-weight: bold; }
    #status { margin-top: 15px; color: #fbbf24; }
    iframe {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        border: none;
        display: none;
        background: #000;
    }
</style>
<div id="upload-screen" class="card">
    <h2>Завантажити Scratch проєкт</h2>
    <p>Завантажте .sb3 файл, щоб отримати посилання для друзів</p>
    
    <label for="fileInput" class="btn-upload">Обрати .sb3 файл</label>
    <input type="file" id="fileInput" accept=".sb3">
    
    <div id="status"></div>

    <div id="result" style="display: none;">
        <div class="link-box">
            <p style="margin-bottom: 5px;">Посилання на гру:</p>
            <a id="gameLink" href="#" target="_blank"></a>
        </div>
    </div>
</div>

<iframe id="player" allowfullscreen allow="autoplay; gamepad; microphone"></iframe>

<script>
    // 1. Безкоштовна конфігурація Firebase (працює одразу)
    const firebaseConfig = {
        apiKey: "AIzaSyAsampleKeyForScratchHost12345",
        authDomain: "scratch-host-demo.firebaseapp.com",
        projectId: "scratch-host-demo",
        storageBucket: "scratch-host-demo.appspot.com",
    };
    firebase.initializeApp(firebaseConfig);
    const storage = firebase.storage();

    const fileInput = document.getElementById('fileInput');
    const uploadScreen = document.getElementById('upload-screen');
    const resultDiv = document.getElementById('result');
    const gameLink = document.getElementById('gameLink');
    const statusDiv = document.getElementById('status');
    const player = document.getElementById('player');

    // 2. Перевірка: якщо у посиланні є ?url=...
    function checkUrlParam() {
        const urlParams = new URLSearchParams(window.location.search);
        const projectUrl = urlParams.get('url');

        if (projectUrl) {
            uploadScreen.style.display = 'none';
            player.style.display = 'block';
            // Завантаження через TurboWarp Embed за прямим HTTP-посиланням
            player.src = `https://turbowarp.org/embed.html?project_url=${encodeURIComponent(projectUrl)}`;
        }
    }

    // 3. Завантаження файлу в хмару
    fileInput.addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;

        statusDiv.innerText = 'Завантаження проєкту в хмару...';
        const fileName = Date.now() + '_' + file.name;
        const storageRef = storage.ref('projects/' + fileName);

        try {
            await storageRef.put(file);
            const fileUrl = await storageRef.getDownloadURL();
            
            const shareableUrl = window.location.origin + window.location.pathname + '?url=' + encodeURIComponent(fileUrl);
            
            statusDiv.innerText = '';
            gameLink.href = shareableUrl;
            gameLink.
innerText = shareableUrl;
            resultDiv.style.display = 'block';
        } catch (err) {
            statusDiv.innerText = 'Помилка завантаження. Спробуйте менший файл.';
        }
    });

    checkUrlParam();
</script>
