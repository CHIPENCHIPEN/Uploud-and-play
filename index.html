<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">

<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background-color: #121212;
        color: #ffffff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
    }
    .card {
        background: #1e1e1e;
        padding: 30px;
        border-radius: 12px;
        text-align: center;
        max-width: 500px;
        width: 90%;
        border: 1px solid #333;
        box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    h2 { margin-bottom: 10px; font-size: 22px; }
    p { color: #aaa; font-size: 14px; margin-bottom: 20px; }
    input[type="file"] { display: none; }
    .btn-upload {
        display: inline-block;
        padding: 12px 24px;
        background: #4f46e5;
        color: #fff;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        transition: background 0.2s;
    }
    .btn-upload:hover { background: #4338ca; }
    .link-box {
        margin-top: 20px;
        padding: 12px;
        background: #2a2a2a;
        border-radius: 8px;
        border: 1px solid #444;
        word-break: break-all;
    }
    a { color: #38bdf8; text-decoration: none; font-weight: bold; }
    #status { margin-top: 15px; color: #fbbf24; font-size: 14px; }
    iframe {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        border: none;
        display: none;
        background: #000;
    }
</style>
<div id="upload-screen" class="card">
    <h2>Завантажити HTML гри</h2>
    <p>Оберіть .html файл з TurboWarp Packager.<br>Отримане посилання можна надсилати друзям!</p>
    
    <label for="fileInput" class="btn-upload">Обрати .html файл</label>
    <input type="file" id="fileInput" accept=".html">
    
    <div id="status"></div>

    <div id="result" style="display: none;">
        <div class="link-box">
            <p style="margin-bottom: 5px; color: #fff;">Публічне посилання для друзів:</p>
            <a id="gameLink" href="#" target="_blank"></a>
        </div>
    </div>
</div>

<iframe id="player" allowfullscreen allow="autoplay; gamepad; microphone"></iframe>

<script>
    const fileInput = document.getElementById('fileInput');
    const uploadScreen = document.getElementById('upload-screen');
    const resultDiv = document.getElementById('result');
    const gameLink = document.getElementById('gameLink');
    const statusDiv = document.getElementById('status');
    const player = document.getElementById('player');

    // Ліміт життя посилання: 20 днів (у мілісекундах)
    const EXPIRATION_TIME = 20 * 24 * 60 * 60 * 1000;

    // Завантаження та відкриття гри з посилання
    function loadGameFromUrl() {
        const hash = window.location.hash;
        if (hash.startsWith('#game=')) {
            try {
                const payload = hash.replace('#game=', '');
                // Декодуємо дані з посилання
                const decompressed = LZString.decompressFromEncodedURIComponent(payload);
                if (!decompressed) throw new Error("Помилка читання");

                const data = JSON.parse(decompressed);
                const now = Date.now();

                // Перевірка 20 днів
                if (now - data.createdAt > EXPIRATION_TIME) {
                    alert('Термін дії цього посилання вичерпано (минуло понад 20 днів з моменту створення).');
                    return;
                }

                // Запускаємо HTML код гри
                uploadScreen.style.display = 'none';
                player.style.display = 'block';
                player.srcdoc = data.html;
            } catch (e) {
                alert('Невалідне або пошкоджене посилання на гру.');
            }
        }
    }
// Обробка вибору файлу та пакування його в публічне посилання
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        statusDiv.innerText = 'Генерація публічного посилання...';

        const reader = new FileReader();
        reader.onload = function(event) {
            const htmlContent = event.target.result;

            // Закодовуємо вміст гри та час створення у структурований об'єкт
            const payloadData = JSON.stringify({
                html: htmlContent,
                createdAt: Date.now()
            });

            // Стискаємо в компактний рядок для URL
            const compressed = LZString.compressToEncodedURIComponent(payloadData);
            const fullUrl = window.location.origin + window.location.pathname + '#game=' + compressed;

            statusDiv.innerText = '';
            gameLink.href = fullUrl;
            gameLink.innerText = fullUrl;
            resultDiv.style.display = 'block';
        };

        reader.readAsText(file);
    });

    loadGameFromUrl();
</script>
